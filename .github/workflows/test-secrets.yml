name: Test Discord Webhook Secret

on:
  workflow_dispatch: # Manual trigger only

jobs:
  test-webhook:
    runs-on: ubuntu-latest
    
    steps:
    - name: Test webhook secret exists
      run: |
        if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
          echo "❌ DISCORD_WEBHOOK_URL secret is not set!"
          exit 1
        else
          echo "✅ DISCORD_WEBHOOK_URL secret exists"
          echo "🔐 URL length: ${#WEBHOOK_URL} characters"
        fi
      env:
        WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    
    - name: Test actual webhook post
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{"content": "🧪 **GitHub Actions Test** - Secret töötab!"}'