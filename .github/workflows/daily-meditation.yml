name: Daily ATL Meditation Bot

on:
  # Run daily at 3:00 UTC (6:00 AM Estonian summer time)
  schedule:
    - cron: '0 3 * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-daily-meditation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post daily meditation
        env:
          # Automaatne valik: schedule → production, workflow_dispatch → test
          DISCORD_WEBHOOK_URL: ${{ github.event_name == 'schedule' && secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_TEST_URL }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python main.py

      - name: Keep repository alive
        if: github.event_name == 'schedule'
        run: |
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DAYS_SINCE=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))
          if [ "$DAYS_SINCE" -gt 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive to prevent workflow disabling"
            git push
          fi
